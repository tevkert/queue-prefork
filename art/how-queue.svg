<svg xmlns="http://www.w3.org/2000/svg" width="960" height="692" viewBox="0 0 960 692" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">How queue-prefork works with queue:work, next to stock workers</title>
<desc id="d">Left, eight stock queue:work workers: each boots Laravel and holds its own copy of the compiled app code, about 81 MB per worker with typical jobs and 645 MB in all. Right, queue-prefork: a template holds the compiled code once, 74 MB in shared memory, and each worker is a warm fork of it carrying only its own data, about 14.5 MB. The processes the supervisor started stay as tiny shell stubs. 192 MB in all, minus 70 percent.</desc>
