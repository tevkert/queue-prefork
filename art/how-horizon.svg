<svg xmlns="http://www.w3.org/2000/svg" width="960" height="692" viewBox="0 0 960 692" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
<title id="t">How queue-prefork works with Horizon, next to stock Horizon</title>
<desc id="d">Left, stock Horizon: the master, each supervisor and each worker boots Laravel and holds its own copy of the compiled app code; a worker uses about 63 MB and all Horizon processes 1,279 MB. Right, queue-prefork: the process the supervisor started becomes a template that holds the compiled code once, 71 MB in shared memory. The master, the fork servers, the supervisors and the workers are its forks and carry only their own data: about 21 MB for the master, 5.2 MB per supervisor and 6.6 MB per worker, 240 MB in all, with more workers running. A new worker is ready in about 1.1 seconds in stock Horizon and 0.19 seconds with queue-prefork.</desc>
