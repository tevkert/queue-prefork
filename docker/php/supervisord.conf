; supervisord for the app containers. It runs as forge (the container's user), like the programs a
; Forge daemon runs. The %(ENV_*)s values are exported by entrypoint.sh.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; The Horizon daemon, as Forge writes it (stopwaitsecs, killasgroup, autorestart).
; SUPERVISOR_STOPASGROUP picks the group mode;
; HORIZON_HANDOFF=0 (HORIZON_HOST=false) has the master spawn its template instead of being forked.
[program:horizon]
command=php /repo/workbench/artisan horizon
environment=QUEUE_PREFORK_HANDOFF="%(ENV_HORIZON_HANDOFF)s"
directory=/repo/workbench
autostart=%(ENV_HORIZON)s
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=5
stopasgroup=%(ENV_SUPERVISOR_STOPASGROUP)s
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Plain queue workers (QUEUE_WORK=true), as Laravel's docs configure them: numprocs, stopasgroup and
; killasgroup. Each process logs to its own file, so per-program output routing can be checked. In the
; prefork container each becomes a stub with a worker forked from the shared template.
[program:queue-work]
command=php /repo/workbench/artisan queue:work redis --queue=%(ENV_QUEUE_WORK_QUEUES)s --sleep=1 --tries=3 --timeout=170 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=%(ENV_QUEUE_WORK_PROCS)s
directory=/repo/workbench
autostart=%(ENV_QUEUE_WORK)s
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=%(ENV_QUEUE_WORK_STOPWAIT)s
stopasgroup=%(ENV_SUPERVISOR_STOPASGROUP)s
killasgroup=true
stdout_logfile=/tmp/queue-work-%(process_num)02d.out
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/queue-work-%(process_num)02d.err
stderr_logfile_maxbytes=0

; The soak's job stream (SOAK_DISPATCH=true). Runs once, for SOAK_DURATION minutes.
[program:soak-dispatch]
command=php /repo/workbench/artisan soak:dispatch --mix=%(ENV_SOAK_MIX)s --rate=%(ENV_SOAK_RATE)s --duration=%(ENV_SOAK_DURATION)s --seed=%(ENV_SOAK_SEED)s
directory=/repo/workbench
autostart=%(ENV_SOAK_DISPATCH)s
autorestart=false
startsecs=0
stopwaitsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; The memory sampler (SOAK_SAMPLE=true): one row per PHP process every SOAK_SAMPLE_INTERVAL seconds
; into /repo/soak/results/$SOAK_MODE/.
[program:soak-sample]
command=php /repo/soak/sample.php --interval=%(ENV_SOAK_SAMPLE_INTERVAL)s
directory=/repo
autostart=%(ENV_SOAK_SAMPLE)s
autorestart=true
startsecs=0
stopwaitsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
